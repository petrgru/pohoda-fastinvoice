# Shared environment for the API and the queue workers (same app image)
x-app-env: &app-env
  PROJECT_NAME: ${PROJECT_NAME:?Variable not set}
  SECRET_KEY: ${SECRET_KEY:?Variable not set}
  FIRST_SUPERUSER: ${FIRST_SUPERUSER:?Variable not set}
  FIRST_SUPERUSER_PASSWORD: ${FIRST_SUPERUSER_PASSWORD:?Variable not set}
  SMTP_HOST: ${SMTP_HOST}
  SMTP_USER: ${SMTP_USER:-}
  SMTP_PASSWORD: ${SMTP_PASSWORD:-}
  EMAILS_FROM_EMAIL: ${EMAILS_FROM_EMAIL}
  DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:?Variable not set}@db:5432/app
  SENTRY_DSN: ${SENTRY_DSN:-}
  MEILISEARCH_ENABLED: ${MEILISEARCH_ENABLED:-true}
  MEILISEARCH_URL: http://meilisearch:7700
  MEILISEARCH_MASTER_KEY: ${MEILISEARCH_MASTER_KEY:-fastinvoice-meili-dev-key}
  # deploy.yml flips the API to "queue"; workers always require the queue
  QUEUE_MODE: ${QUEUE_MODE:-inline}

services:

  proxy:
    image: traefik:v3.7
    volumes:
      # Add Docker as a mounted volume, so that Traefik can read the labels of other services
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command:
      # Enable Docker in Traefik, so that it reads labels from Docker services
      - --providers.docker
      # Do not expose all Docker services, only the ones explicitly exposed
      - --providers.docker.exposedbydefault=false
      # Create an entrypoint "http" listening on port 80
      - --entrypoints.http.address=:80
      # Enable the access log, with HTTP requests
      - --accesslog
      # Enable the Traefik log, for configurations and errors
      - --log

  db:
    image: postgres:18
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d app"]
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 10s
    volumes:
      - app-db-data:/var/lib/postgresql
    environment:
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?Variable not set}
      - POSTGRES_DB=app

  adminer:
    image: adminer
    depends_on:
      - db
    environment:
      - ADMINER_DESIGN=pepa-linha-dark
    labels:
      # Enable Traefik for this service
      - traefik.enable=true
      # Route HTTP traffic for the Adminer subdomain
      - traefik.http.routers.adminer-http.rule=Host(`adminer.${DOMAIN:-localhost}`)
      - traefik.http.routers.adminer-http.entrypoints=http
      # Define the port inside of the Docker service to use
      - traefik.http.services.adminer.loadbalancer.server.port=8080

  meilisearch:
    image: getmeili/meilisearch:v1.56
    environment:
      - MEILI_MASTER_KEY=${MEILISEARCH_MASTER_KEY:-fastinvoice-meili-dev-key}
      - MEILI_ENV=production
    volumes:
      - meilisearch-data:/meili_data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:7700/health || wget -qO- http://localhost:7700/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    image: backend:latest
    depends_on:
      db:
        condition: service_healthy
        restart: true
    environment: *app-env

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/utils/health-check/"]
      interval: 10s
      timeout: 5s
      retries: 5

    build:
      context: .
      dockerfile: backend/Dockerfile
    labels:
      # Enable Traefik for this service
      - traefik.enable=true

      # Define the port inside of the Docker service to use
      - traefik.http.services.backend.loadbalancer.server.port=8000

      # Route HTTP traffic for this domain
      - traefik.http.routers.backend-http.rule=Host(`${DOMAIN:-localhost}`)
      - traefik.http.routers.backend-http.entrypoints=http

  worker-parse:
    image: backend:latest
    depends_on:
      db:
        condition: service_healthy
        restart: true
    # long LLM calls live here, not in the API workers - keep the queue small
    # so the single LLM backend is never hit by more than two parses
    command:
      - procrastinate
      - --app
      - app.tasks.app
      - worker
      - --queues
      - parse
      - --concurrency
      - "2"
    environment: *app-env
    healthcheck:
      test: ["CMD", "procrastinate", "--app", "app.tasks.app", "healthchecks"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  worker-light:
    image: backend:latest
    depends_on:
      db:
        condition: service_healthy
        restart: true
    # emails + the periodic maintenance passes (stale export claims, stalled
    # parsing rescue) kept separate so a long parse never delays either
    command:
      - procrastinate
      - --app
      - app.tasks.app
      - worker
      - --queues
      - email,maintenance
      - --concurrency
      - "4"
    environment: *app-env
    healthcheck:
      test: ["CMD", "procrastinate", "--app", "app.tasks.app", "healthchecks"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  app-db-data:
  meilisearch-data:

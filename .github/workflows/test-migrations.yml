name: Test Migrations

on:
  push:
    branches:
      - master
  pull_request:
permissions:
  contents: read

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: ci-postgres
          POSTGRES_DB: app
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U postgres -d app"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:ci-postgres@localhost:5432/app
      SECRET_KEY: ci-not-really-secret-but-long-enough
      FIRST_SUPERUSER: ci@example.com
      FIRST_SUPERUSER_PASSWORD: ci-password-1234
      PROJECT_NAME: CI
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "latest-known"
      - name: Upgrade to head
        run: uv run --project backend alembic -c backend/alembic.ini upgrade head
      - name: Round-trip every migration (downgrade then upgrade)
        run: |
          set -e
          alembic="uv run --project backend alembic -c backend/alembic.ini"
          count=0
          # walk down to base one revision at a time
          while $alembic current 2>/dev/null | grep -q .; do
            count=$((count+1))
            $alembic downgrade -1
          done
          echo "Downgraded $count revision(s) one by one"
          # walk back up one revision at a time
          until $alembic current 2>/dev/null | grep -q "(head)"; do
            $alembic upgrade +1
          done
          $alembic current
